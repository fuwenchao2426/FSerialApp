name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 1. 自动生成签名文件 (解决 Keystore not found 报错)
    - name: Generate debug.keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 2. 创建假的 google-services.json (解决 File missing 报错)
    # 注意：如果你想要真实体验 Firebase 功能，需要在仓库的 Secrets 里配置真实的 json。
    # 这里为了能成功打出包，先创建一个占位符文件骗过编译器。
    - name: Create dummy google-services.json
      run: |
        echo '{
          "project_info": {
            "project_number": "123456789012",
            "project_id": "seriallab-dummy",
            "storage_bucket": "seriallab-dummy.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:1234567890123456",
                "android_client_info": {
                  "package_name": "com.example.fserialapp"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyDummyKey1234567890"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }' > app/google-services.json

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SerialLab-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
